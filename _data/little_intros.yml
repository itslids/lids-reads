# Each kid's own intro, shown at the top of their section on the Little Lids page.
# Keyed by the nickname's slug (lowercase). Their words; only light cleanup.
banana: |
  Hey, I'm one of the Little Lids. You can call me Banana. I'm new to reading a set number of books per year, so I'm starting next year. I hope to read and finish 25 books in 2027!

  What I like is dark-ish fantasy and sci-fi. I LOVED *The Maze Runner* by James Dashner and would recommend it to everyone. I like it when the characters in a book are witty and not too unrealistic. I feel like they need to be relatable. I really hate it when a character can't communicate and just doesn't matter or care about the story.

  One more thing about me: I'm writing my own story right now and loving it!

  I sometimes have some really hot takes, so just keep that in mind. It is said that I have a lot of opinions for someone so short.

  Let us commence with the reading! 📚
