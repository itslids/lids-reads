# Short reviews by the kids, shown on their Finished cards on the Little Lids page.
# Keyed by the kid's slug, then the book's id from _data/little_read.json (hc-<number>).
# Their words; only light typo and clarity fixes.
# A plain text value is just the review. To add stars, use:
#   hc-12345:
#     rating: 4.5
#     text: |
#       The review.
banana:
  hc-153090:  # Queen of Shadows, Sarah J. Maas
    rating: 4
    text: |
      So good and eventful. Lots of Rowan and Celaena in this one! Can't stop thinking about what's going to happen with Elide.
  hc-10265:  # The Death Cure, James Dashner
    rating: 3
    text: |
      It was good but I didn't like it as much as the other books. It just didn't feel as impactful. The plot was good, though. Just not as exciting as others in the series.
  hc-444942:  # The Scorch Trials, James Dashner
    rating: 4
    text: |
      The setting was a lot more interesting and diverse, which made it a cool book to read. Some of the girl characters were boring, but otherwise pretty great. Teresa confused me a lot in this book and that got annoying!
  hc-109009:  # The Maze Runner, James Dashner
    rating: 4
    text: |
      Really good introduction to the series. I like the descriptive language. Definitely love the characters.
  hc-382513:  # A Good Girl's Guide to Murder, Holly Jackson
    rating: 3
    text: |
      I liked this. I feel like the evidence was a little slow and repetitive, but it was otherwise pretty good.
  hc-283659:  # Crown of Midnight, Sarah J. Maas
    rating: 3.5
    text: |
      This one felt like it was a lot of Celaena and Chaol together. Nothing else, really.
  hc-1363844:  # Heir of Fire, Sarah J. Maas
    rating: 5
    text: |
      Rowan is amazing and Celaena just gets worse. I cannot get over Doranelle.
  hc-548931:  # Crank Palace, James Dashner
    rating: 4
    text: |
      Cried a lot. Read it between Death Cure and Kill Order for best effect.
  hc-277804:  # The Kill Order, James Dashner
    rating: 2.5
    text: |
      This one was just boring and I didn't like it as much as the other Maze Runner books. I kept falling asleep.
  hc-39629:  # Throne of Glass, Sarah J. Maas
    rating: 4.5
    text: |
      OH MY GOD!

      My first experience actually staying up till 3 AM reading a book.

      No words. ❤️
  hc-204230:  # Stargirl, Jerry Spinelli
    rating: 2
    text: |
      Eh, fine. I read it for school. I got the lesson. Honestly, it could've been worse. I think it got better gradually through the story, but the characters don't have goals or wants; they kinda are just pushed by the plot.
  hc-228700:  # The Cheerleaders, Kara Thomas
    rating: 1
    text: |
      BAD. Please do not waste your time.

      The main character is really annoying, difficult to like, and can't communicate. I want my life back.
