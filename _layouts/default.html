<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="alternate" type="application/atom+xml" title="Lids Reads reviews" href="{{ '/feed/reviews.xml' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <a class="brand" href="{{ '/' | relative_url }}">Lids <em>Reads</em></a>
      <nav aria-label="Site">
        <a href="{{ '/' | relative_url }}">Reviews</a>
        <a href="{{ '/stats/' | relative_url }}">Stats</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        {% if site.substack_url != "" %}<a href="{{ site.substack_url }}">Newsletter</a>{% endif %}
        <a href="{{ '/feed/reviews.xml' | relative_url }}">RSS</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="wrap footer">
    <p>Lids Reads · reviews by {{ site.author }} · <a href="{{ '/feed/reviews.xml' | relative_url }}">Subscribe by RSS</a>{% if site.substack_url != "" %} or <a href="{{ site.substack_url }}">by email</a>{% endif %}</p>
  </footer>
</body>
</html>
