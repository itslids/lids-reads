name: Goodreads feed probe (temporary)

on:
  push:
    branches: [claude/goodreads-feed-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump profile page sections
        run: |
          curl -s -A "Mozilla/5.0" -L -o profile.html "https://www.goodreads.com/user/show/6818060"
          wc -c profile.html
          python3 - <<'PY'
          import re
          h = open("profile.html", encoding="utf-8").read()
          for key in ["currently-reading", "currentlyReading", "Currently Reading", "challenge", "/book/show/"]:
              print("##", key, h.count(key))
          i = h.find("currently-reading")
          print(h[max(0, i-3000):i+6000])
          j = h.find("challenge")
          print("#### CHALLENGE")
          print(h[max(0, j-500):j+1500])
          PY
