name: Goodreads feed probe (temporary)

on:
  push:
    branches: [claude/goodreads-feed-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/hardcover-sync
      - name: Dry run of the Hardcover script (no commit)
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
        run: |
          cp _data/read.json /tmp/old_read.json
          python scripts/update_reading.py
          python3 - <<'PY'
          import json
          old = {b["title"].lower(): b for b in json.load(open("/tmp/old_read.json"))["books"]}
          new = {b["title"].lower(): b for b in json.load(open("_data/read.json"))["books"]}
          print("old", len(old), "new", len(new))
          print("only in old:", [old[t]["title"] for t in old if t not in new])
          print("only in new:", [(new[t]["title"], new[t]["id"], new[t]["date"]) for t in new if t not in old])
          diff = [(t, old[t]["date"], new[t]["date"], old[t]["rating"], new[t]["rating"]) for t in old if t in new and (old[t]["date"] != new[t]["date"] or old[t]["rating"] != new[t]["rating"])]
          print("date/rating changes:", diff)
          print("currently reading:", [b["title"] for b in json.load(open("_data/reading.json"))["currently_reading"]])
          PY
