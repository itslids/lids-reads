name: Goodreads feed probe (temporary)

on:
  push:
    branches: [claude/goodreads-feed-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try Lindsey's link and feed variants
        run: |
          for u in \
            "https://www.goodreads.com/review/list/6818060-l?shelf=read" \
            "https://www.goodreads.com/review/list/6818060-l?shelf=currently-reading" \
            "https://www.goodreads.com/review/list_rss/6818060-l?shelf=read" \
            "https://www.goodreads.com/review/list_rss/6818060-l?shelf=currently-reading" \
            "https://www.goodreads.com/review/list_rss/6818060?shelf=read&key=" ; do
            echo "=== $u"
            curl -s -A "Mozilla/5.0" -o body.txt -L -w 'status=%{http_code} final=%{url_effective}\n' "$u"
            python3 -c "import re;h=open('body.txt',encoding='utf-8',errors='replace').read();t=re.search(r'<title>(.*?)</title>',h,re.S);print('title:',t.group(1).strip() if t else None,'| items:',h.count('<item>'),'| book rows:',h.count('class=\"bookalike review\"'))"
          done
