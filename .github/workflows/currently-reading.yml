name: Update currently reading

on:
  schedule:
    - cron: "17 13 * * *"   # daily, about 7:17 AM Mountain
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Goodreads shelves
        run: python scripts/update_reading.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/reading.json _data/read.json
          git commit -m "Update currently reading"
          git push
