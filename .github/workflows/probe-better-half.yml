name: Probe Better Half lists (temporary)
on:
  push:
    branches: [claude/project-thread-pcrb9l]
    paths: [.github/workflows/probe-better-half.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Count audiobook fields (no titles printed)
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
        shell: python
        run: |
          import json, os, urllib.request
          q = """{ me { lists { name list_books { date_added reason
                edition { audio_seconds edition_format reading_format_id cached_contributors }
                book { audio_seconds } } } } }"""
          t = os.environ["HARDCOVER_TOKEN"].strip()
          t = t if t.lower().startswith("bearer ") else "Bearer " + t
          req = urllib.request.Request("https://api.hardcover.app/v1/graphql",
              data=json.dumps({"query": q}).encode(),
              headers={"content-type": "application/json", "authorization": t, "user-agent": "lids-reads"})
          res = json.load(urllib.request.urlopen(req, timeout=30))
          if res.get("errors"):
              print("ERRORS", [e.get("message") for e in res["errors"]]); raise SystemExit
          me = res["data"]["me"]; me = me[0] if isinstance(me, list) else me
          for l in me["lists"]:
              if not l["name"].lower().startswith("lids better half"): continue
              lb = l["list_books"]
              roles = {}
              for x in lb:
                  for c in (x["edition"] or {}).get("cached_contributors") or []:
                      r = c.get("contribution") or "author"; roles[r] = roles.get(r, 0) + 1
              print(l["name"], "| books:", len(lb),
                    "| edition audio_seconds:", sum(1 for x in lb if (x["edition"] or {}).get("audio_seconds")),
                    "| book audio_seconds:", sum(1 for x in lb if x["book"].get("audio_seconds")),
                    "| formats:", sorted({str((x["edition"] or {}).get("edition_format")) for x in lb}),
                    "| reading_format_ids:", sorted({str((x["edition"] or {}).get("reading_format_id")) for x in lb}),
                    "| contributor roles:", roles,
                    "| with notes:", sum(1 for x in lb if (x.get("reason") or "").strip()))
